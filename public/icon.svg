<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Gitash</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>
  <!-- G letterform as circuit/git graph path -->
  <path d="M24,7 L8,7 L8,25 L24,25 L24,16 L15,16"
        stroke="#e4e4e7" stroke-width="2.2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Feature branch diverging from bar terminus -->
  <line x1="15" y1="16" x2="22" y2="9"
        stroke="#a1a1aa" stroke-width="1.6"
        stroke-linecap="round" opacity="0.6"/>
  <!-- Commit nodes -->
  <circle cx="24" cy="7"  r="2.4" fill="#e4e4e7"/>
  <circle cx="8"  cy="25" r="2.4" fill="#e4e4e7"/>
  <circle cx="15" cy="16" r="2.0" fill="#a1a1aa"/>
  <circle cx="22" cy="9"  r="1.6" fill="#a1a1aa" opacity="0.65"/>
</svg>
