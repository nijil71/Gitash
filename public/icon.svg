<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Gitash</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>
  <!-- G letterform as circuit/git graph path -->
  <path d="M24,7 L8,7 L8,25 L24,25 L24,16 L15,16"
        stroke="#22c55e" stroke-width="2.2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Feature branch diverging from bar terminus -->
  <line x1="15" y1="16" x2="22" y2="9"
        stroke="#4ade80" stroke-width="1.6"
        stroke-linecap="round" opacity="0.5"/>
  <!-- Commit nodes -->
  <circle cx="24" cy="7"  r="2.4" fill="#22c55e"/>
  <circle cx="8"  cy="25" r="2.4" fill="#22c55e"/>
  <circle cx="15" cy="16" r="2.0" fill="#4ade80"/>
  <circle cx="22" cy="9"  r="1.6" fill="#4ade80" opacity="0.65"/>
</svg>
